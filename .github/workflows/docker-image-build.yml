name: Docker Image Build

on:
  release:
    types: [published]
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build, e.g. v0.1.0"
        required: false

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            VERSION="v0.1.0"
          else
            VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then VERSION="sha-$(git rev-parse --short HEAD)"; fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          tags: |
            ${{ env.ACR }}/thingspanel-notification-aliyun-sms:${{ env.VERSION }}
